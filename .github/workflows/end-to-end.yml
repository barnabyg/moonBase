name: End-to-end

# Writing can't change what the game does, so a change only to it skips these
# tests. It still gets the checks in verify.yml, which format and scan Markdown.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

# A new push to a pull request cancels its run that is still going, which
# checked code that has since changed. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: End-to-end tests, chromium (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    # The tests in e2e/ run in Chromium, the desktop app's engine, against the
    # dev server, as a quick stand-in for the desktop window (ADR-0010), shared
    # out over four runners. A failure on one leaves the others running, to
    # report their failures too.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # All the tests on one runner have taken up to about 20 minutes, and they
    # grow with each new test; see docs/verification.md.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      # Playwright's Chromium is kept in GitHub's cache, keyed on the pinned
      # Playwright version, so most runs download nothing. The runner image
      # already has every library it needs; Playwright's --with-deps would
      # also fetch fonts and video codecs the tests never use from Ubuntu's
      # mirrors, which have stalled CI runs for up to 24 minutes.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright's chromium
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Chromium's headless runs use Playwright's separate headless shell,
      # which installing chromium fetches too.
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        timeout-minutes: 3
      # The runner has no GPU and no display. Chromium needs neither: headless,
      # it draws WebGL2 with its own software renderer (SwiftShader), which
      # Playwright enables.
      - run: npm run verify -- --e2e-only --project=chromium
        env:
          E2E_SHARD: ${{ matrix.shard }}/4
      # A failing end-to-end test leaves the page as it was, as an
      # accessibility snapshot and a screenshot, in test-results. CI can't
      # be run locally with its software renderer, so keep them to diagnose.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-chromium-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  desktop:
    name: End-to-end tests, desktop app (Electron)
    # Windows, as the desktop app is Windows only (ADR-0010): this tests the
    # Electron build on the platform players run it on. The runner has no
    # GPU; Electron draws WebGL there in software (SwiftShader, which the
    # tests allow in CI; see e2e/desktop/fixtures.ts), and needs no virtual
    # display, unlike Electron on Linux, which would also need its sandbox
    # turned off.
    runs-on: windows-2025
    # The tests take about 15 seconds on a developer's PC with a GPU; drawing
    # in software is several times slower. See docs/verification.md.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci downloads Electron's binary (over 100 MB) as it installs it,
      # unless it is already in Electron's download cache. That is kept in
      # GitHub's cache, keyed on the pinned Electron version.
      - name: Read the Electron version
        id: electron
        shell: bash
        run: echo "version=$(node -p "require('./package.json').devDependencies.electron")" >> "$GITHUB_OUTPUT"
      - name: Restore Electron's download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}
      - run: npm ci
        timeout-minutes: 6
      - run: npm run verify -- --e2e-only --project=electron
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-electron
          path: test-results/
          retention-days: 14
