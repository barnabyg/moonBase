name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # A normal run takes under 2 minutes. Fail a stalled download quickly, so
    # the run can be retried, rather than waiting for GitHub's 6-hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      # Playwright's Firefox is kept in GitHub's cache, keyed on the pinned
      # Playwright version, so most runs download nothing. The runner image
      # already has every library Firefox needs; Playwright's --with-deps would
      # also fetch fonts and video codecs the tests never use from Ubuntu's
      # mirrors, which have stalled CI runs for up to 24 minutes.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright's Firefox
        id: firefox-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.firefox-cache.outputs.cache-hit != 'true'
        run: npx playwright install firefox
        timeout-minutes: 3
      # The runner has no GPU. Mesa's software OpenGL (llvmpipe) gives Firefox
      # the WebGL2 context the renderer needs, but only with a display, so the
      # end-to-end tests run Firefox with a window in a virtual X display.
      - name: Install software OpenGL and a virtual display
        timeout-minutes: 3
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0 libgles2 xvfb
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" npm run verify
        env:
          PLAYWRIGHT_HEADED: "1"
