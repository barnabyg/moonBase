name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its run that is still going, which
# checked code that has since changed. Runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# This job and those in end-to-end.yml run side by side and together cover
# every check in `npm run verify`. Only the end-to-end jobs need a browser, so
# a lint, type or unit test failure reports without waiting for browser setup,
# and "Re-run failed jobs" repeats only the jobs that failed.
jobs:
  checks:
    name: Checks (all but end-to-end)
    runs-on: ubuntu-24.04
    # The runners' speed varies a lot: this job has taken from under a minute
    # to 6 minutes. The limit is several times the slowest, rather than
    # GitHub's 6-hour default; the download steps have their own short limits,
    # so a stalled download still fails quickly and the run can be retried.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - run: npm run verify -- --skip-e2e
